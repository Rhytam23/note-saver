[package]
name = "notenirman"
version = "0.1.0"
description = "NoteNirman Desktop"
authors = ["NoteNirman"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Rhytam23/note-saver"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"

# Desktop only: a second launch (e.g. the OS opening notenirman://auth-callback) must hand
# its URL to the already-running window instead of opening a second copy.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
