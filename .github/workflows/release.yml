name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    # Job-level on purpose: tauri-action runs `npm run build` again (beforeBuildCommand) and that
    # second build is the one embedded in the .exe/.msi. When these were set on the earlier
    # "Build Web Application" step only, the shipped Windows app was built with NO Supabase URL and
    # every sign-up/sign-in failed with "Failed to fetch".
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tcisqeieyyhdlfwvvsec.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_GgCh1LuEfnCuWnRjDccyWA_i4GRP8N5' }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '699121691348-4rhtqociutiobvgfbq94udhre0b0tsq3.apps.googleusercontent.com' }}
      VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME || 'notenirman_bot' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync App Version From Tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Exclude landing-page downloads from the app bundle
        shell: pwsh
        # public/downloads holds the landing page's previous .exe and .apk (~57 MB). Vite copies public/
        # into dist/, and dist/ is what gets embedded in the native app, so without this every release
        # contained the previous release inside itself (v0.1.3 came out at 60 MB instead of 27 MB, and it
        # would have doubled again). The native apps never need those files: the website serves them.
        run: Remove-Item -Recurse -Force public/downloads -ErrorAction SilentlyContinue

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The VITE_* build settings come from the job-level env above.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NoteNirman ${{ github.ref_name }}'
          releaseBody: 'NoteNirman Automated Release ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false

      - name: Verify Supabase settings are inside the built web assets
        shell: pwsh
        # Fails the job (before the MSIX and artifacts are trusted) if the frontend that got embedded in
        # the app was built without the Supabase URL - the bug that made Windows sign-up fail.
        run: |
          if (-not (Select-String -Path dist/assets/*.js -SimpleMatch -Pattern $env:VITE_SUPABASE_URL -Quiet)) {
            throw "dist/ does not contain VITE_SUPABASE_URL: the app would ship without a backend."
          }
          Write-Host "OK: Supabase URL is baked into dist/"

      - name: Collect Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts-windows
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.exe, *.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts-windows/"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts-windows/*

      - name: Build Microsoft Store Package (MSIX)
        shell: pwsh
        # Uses placeholder identity until MSIX_IDENTITY_NAME etc. are set as
        # repo secrets (see docs/MICROSOFT-STORE.md) - that placeholder
        # package sideload-tests fine but is not submittable to the Store.
        # Never fails the release: this is a separate, optional artifact.
        continue-on-error: true
        run: |
          $params = @{}
          if ("${{ secrets.MSIX_IDENTITY_NAME }}") { $params.IdentityName = "${{ secrets.MSIX_IDENTITY_NAME }}" }
          if ("${{ secrets.MSIX_PUBLISHER }}") { $params.Publisher = "${{ secrets.MSIX_PUBLISHER }}" }
          if ("${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}") { $params.PublisherDisplayName = "${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}" }
          ./src-tauri/msix/build-msix.ps1 @params

      - name: Upload MSIX Package
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: src-tauri/msix/dist/*.msix
          if-no-files-found: warn

  build-android:
    name: Build Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync App Version From Tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        # android-actions/setup-android@v3 fails outright on current runner
        # images: it unconditionally requests the legacy 'tools' package,
        # which Google removed from the SDK repository years ago
        # ("Warning: Failed to find package 'tools'" -> exit 1). ubuntu-latest
        # already ships a pre-provisioned SDK (that's where the broken
        # action's own sdkmanager binary came from), so just accept licenses
        # and install the exact, still-valid packages this project needs.
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found anywhere under \$ANDROID_HOME ($ANDROID_HOME)"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Exclude landing-page downloads from the app bundle
        # public/downloads holds the landing page's previous .exe and .apk (~57 MB). Vite copies public/
        # into dist/, and dist/ is what gets embedded in the native app, so without this every release
        # contained the previous release inside itself (v0.1.3 came out at 60 MB instead of 27 MB, and it
        # would have doubled again). The native apps never need those files: the website serves them.
        run: rm -rf public/downloads

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tcisqeieyyhdlfwvvsec.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_GgCh1LuEfnCuWnRjDccyWA_i4GRP8N5' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '699121691348-4rhtqociutiobvgfbq94udhre0b0tsq3.apps.googleusercontent.com' }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME || 'notenirman_bot' }}
        run: npm run build

      - name: Verify Supabase settings are inside the built web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tcisqeieyyhdlfwvvsec.supabase.co' }}
        run: |
          grep -rlF "$VITE_SUPABASE_URL" dist/assets > /dev/null || { echo "dist/ does not contain VITE_SUPABASE_URL"; exit 1; }
          echo "OK: Supabase URL is baked into dist/"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Signing with a throwaway debug key; users will not be able to update this APK in place later."
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          export APP_VERSION_NAME="$VERSION"
          export APP_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Collect Android Artifacts
        run: |
          mkdir -p artifacts-android
          cp android/app/build/outputs/apk/release/*.apk "artifacts-android/NoteNirman-${GITHUB_REF_NAME}.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts-android/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-files/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-files/

      # Stable, version-less copies of the installers. GitHub serves
      # releases/latest/download/<name> for whatever the newest release is, so
      # the website can redirect /downloads/NoteNirman.apk and
      # /downloads/NoteNirman-Setup.exe there (see vercel.json) and the links
      # never need to change. The installers themselves live only in Releases,
      # never in git history.
      - name: Add Stable-Named Installer Copies
        shell: bash
        run: |
          cp "$(ls release-files/*setup.exe | head -n 1)" release-files/NoteNirman-Setup.exe
          cp "$(ls release-files/*.apk | head -n 1)" release-files/NoteNirman.apk

      - name: Display Release Artifacts
        run: ls -la release-files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The landing page's version label and the in-app update-check banner both read
      # /downloads/version.json. Only that tiny manifest is committed, and only to the `deployment`
      # branch, which is the branch Vercel serves. `main` stays human-only and protected.
      # The commit is created through the GitHub API so that GitHub signs it: Vercel only deploys
      # commits that GitHub marks as verified, and a plain `git commit` from here would be unsigned.
      - name: Publish Latest Version Manifest To The Deployment Branch
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONTENT=$(printf '{\n  "version": "%s",\n  "windows": "/downloads/NoteNirman-Setup.exe",\n  "android": "/downloads/NoteNirman.apk",\n  "publishedAt": "%s"\n}\n' "$VERSION" "$(date -u +%Y-%m-%d)" | base64 -w0)
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/public/downloads/version.json?ref=deployment" --jq .content 2>/dev/null | tr -d '\n' || true)
          if [ "$CURRENT" = "$CONTENT" ]; then
            echo "No version manifest changes for $VERSION."
            exit 0
          fi
          HEAD_OID=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deployment" --jq .object.sha)
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg msg "chore: publish v$VERSION version manifest to landing page" --arg head "$HEAD_OID" --arg content "$CONTENT" \
            '{query: "mutation($input: CreateCommitOnBranchInput!){ createCommitOnBranch(input:$input){ commit{ oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: "deployment"},
                message: {headline: $msg},
                fileChanges: {additions: [{path: "public/downloads/version.json", contents: $content}]},
                expectedHeadOid: $head}}}' \
            | gh api graphql --input -
