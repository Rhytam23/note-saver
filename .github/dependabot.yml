version: 2
updates:
  # Regular (non-security) updates are grouped into one weekly PR per ecosystem to keep noise low.
  # Security updates are separate and still arrive immediately, one per vulnerability.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 needs a PostCSS plugin swap and a styling migration; do it deliberately, not by bot.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, "area: ci"]
