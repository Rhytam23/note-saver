<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NoteNirman">
  <title>NoteNirman</title>
  <!-- Deep Indian blue tile -->
  <rect width="512" height="512" rx="112" fill="#14213D"/>

  <!-- Lotus: outer petals, then inner petals, then the note-page petal in front -->
  <g transform="translate(256 360) scale(1.14)">
    <path d="M0 -158 C50 -98 58 -18 0 46 C-58 -18 -50 -98 0 -158Z" fill="#E8850C" transform="rotate(-70)"/>
    <path d="M0 -158 C50 -98 58 -18 0 46 C-58 -18 -50 -98 0 -158Z" fill="#E8850C" transform="rotate(70)"/>
    <path d="M0 -168 C58 -104 66 -18 0 50 C-66 -18 -58 -104 0 -168Z" fill="#FF9933" transform="rotate(-35)"/>
    <path d="M0 -168 C58 -104 66 -18 0 50 C-66 -18 -58 -104 0 -168Z" fill="#FF9933" transform="rotate(35)"/>

    <!-- Centre petal is the note page -->
    <path d="M0 -196 C64 -122 72 -22 0 54 C-72 -22 -64 -122 0 -196Z" fill="#FFF8EC"/>
    <g stroke="#14213D" stroke-width="11" stroke-linecap="round">
      <line x1="-26" y1="-62" x2="26" y2="-62"/>
      <line x1="-32" y1="-28" x2="32" y2="-28"/>
      <line x1="-24" y1="6" x2="24" y2="6"/>
    </g>
  </g>

  <!-- Green ground the lotus grows from -->
  <path d="M96 420 Q256 462 416 420" fill="none" stroke="#138808" stroke-width="16" stroke-linecap="round"/>
</svg>
