<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="NoteNirman on Telegram">
  <title>NoteNirman on Telegram</title>
  <rect width="640" height="360" fill="#14213D"/>
  <rect x="0" y="352" width="213" height="8" fill="#FF9933"/>
  <rect x="213" y="352" width="214" height="8" fill="#FFF8EC"/>
  <rect x="427" y="352" width="213" height="8" fill="#138808"/>

  <!-- Lotus -->
  <g transform="translate(150 250) scale(0.78)">
    <path d="M0 -158 C50 -98 58 -18 0 46 C-58 -18 -50 -98 0 -158Z" fill="#E8850C" transform="rotate(-70)"/>
    <path d="M0 -158 C50 -98 58 -18 0 46 C-58 -18 -50 -98 0 -158Z" fill="#E8850C" transform="rotate(70)"/>
    <path d="M0 -168 C58 -104 66 -18 0 50 C-66 -18 -58 -104 0 -168Z" fill="#FF9933" transform="rotate(-35)"/>
    <path d="M0 -168 C58 -104 66 -18 0 50 C-66 -18 -58 -104 0 -168Z" fill="#FF9933" transform="rotate(35)"/>
    <path d="M0 -196 C64 -122 72 -22 0 54 C-72 -22 -64 -122 0 -196Z" fill="#FFF8EC"/>
    <g stroke="#14213D" stroke-width="11" stroke-linecap="round">
      <line x1="-26" y1="-62" x2="26" y2="-62"/><line x1="-32" y1="-28" x2="32" y2="-28"/><line x1="-24" y1="6" x2="24" y2="6"/>
    </g>
  </g>
  <path d="M70 318 Q150 340 230 318" fill="none" stroke="#138808" stroke-width="9" stroke-linecap="round"/>

  <g font-family="'Segoe UI', Arial, sans-serif" fill="#FFF8EC">
    <text x="300" y="86" font-size="38" font-weight="700">NoteNirman</text>
    <text x="300" y="120" font-size="20" fill="#FF9933">Your notes, right in Telegram</text>
    <g font-size="19">
      <circle cx="308" cy="168" r="5" fill="#FF9933"/><text x="326" y="175">Write a note with /title</text>
      <circle cx="308" cy="205" r="5" fill="#FF9933"/><text x="326" y="212">Search, pin and prioritise</text>
      <circle cx="308" cy="242" r="5" fill="#FF9933"/><text x="326" y="249">To-dos, flashcards, reminders</text>
      <circle cx="308" cy="279" r="5" fill="#FF9933"/><text x="326" y="286">Syncs with app, desktop and web</text>
    </g>
